name: Build Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate Dummy Files and Build APK
        run: |
          # 1. Create debug keystores
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

          # 2. Auto-detect project package name
          PKG_NAME=$(grep -rE "(applicationId|namespace)\s*=?\s*[\"'][^\"']+[\"']" app/ | sed -E "s/.*[\"']([^\"']+)[\"'].*/\1/" | head -n 1)
          if [ -z "$PKG_NAME" ]; then
            PKG_NAME="com.aistudio.clock.qvrz"
          fi
          echo "Detected package name: $PKG_NAME"

          # 3. Create google-services.json matching the detected package name
          mkdir -p app
          cat << EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "dummy-clock-project",
              "storage_bucket": "dummy-clock-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                  "android_client_info": {
                    "package_name": "$PKG_NAME"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          # 4. Update wrapper and build APK
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clock-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
